[package]
name = "chart_tool"
version = "0.1.0"
edition = "2021"
description = "Build-time tool: decodes each song with ffmpeg and writes its analysis and five charts. The rules are tool_core's."
publish = false

[[bin]]
name = "chart"
path = "src/main.rs"

[dependencies]
tool_core = { path = "../core" }
serde_json = "1"
